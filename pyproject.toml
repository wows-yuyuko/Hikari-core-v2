[project]
name = "hikari-core"
version = "2.0.1"
description = "SDK for yuyuko,战舰世界yuyuko平台BOT SDK"
authors = [
    {name = "benx1n", email = "1119809439@qq.com"},
    {name = "雨季", email = "2622749113@qq.com"},
]
readme = "README.md"
keywords = ["qqbot", "wows", "wws", "bot", "stats"]
requires-python = ">=3.11,<3.13"

# 依赖列表（标准 PEP 621 格式）
dependencies = [
    "httpx[http2] >=0.28.0",
    "APScheduler >=3.10.1",
    "pydantic >=2.0.3",
    "playwright >=1.62.0",
    "loguru >=0.7.0",
    "pillow >=12.2.0"
]

[project.urls]
homepage = "https://github.com/wows-yuyuko/Hikari-core-v2"
repository = "https://github.com/wows-yuyuko/Hikari-core-v2"

# 开发依赖（uv sync 默认安装，可用 --no-dev 跳过）
[dependency-groups]
dev = [
    "ruff >=0.14.0",
    "black >=25.0.0",
]

[build-system]
requires = ["uv_build >=0.12.0, <0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "hikari_core"
# 包体在仓库根目录（非 src 布局），故根目录留空
module-root = ""

# 国内镜像源：阿里云为默认索引，腾讯/清华作为补充源
[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[[tool.uv.index]]
name = "tencent"
url = "https://mirrors.cloud.tencent.com/pypi/simple/"

[[tool.uv.index]]
name = "tsinghua"
url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple/"

[tool.black]
line-length = 150
skip-string-normalization = true

[tool.ruff]
line-length = 150
respect-gitignore = true
ignore-init-module-imports = true
select = [
    'F',  # pyflakes
    'E',  # pycodestyle errors
    'W',  # pycodestyle warnings
    'I',  # isort
    'C',  # flake8-comprehensions
    'B',  # flake8-bugbear
    'Q',  # flake8-quotes
    'PL',  # pylint
    'RUF',  # Ruff-specific rules
]
ignore = [
    'E501',
    "RUF001",
    "RUF002",
    "RUF003",
    "PLR2004",
    "C901",
    "PLR0912",
    "PLR0911",
    "PLW0603"
]
flake8-quotes = {inline-quotes = 'single', multiline-quotes = 'double'}
