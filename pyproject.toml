[project]
name = "hikari-core"
version = "1.2.5"
description = "SDK for yuyuko,战舰世界yuyuko平台BOT SDK"
authors = [
    {name = "benx1n", email = "1119809439@qq.com"},
    {name = "雨季", email = "2622749113@qq.com"},
]
readme = "README.md"
keywords = ["qqbot", "wows", "wws", "bot", "stats"]
requires-python = ">=3.11,<3.13"

# 依赖列表（标准 PEP 621 格式）
dependencies = [
    "httpx[http2] >=0.28.0",
    "orjson >=3.11.6",
    "asyncio >=3.4.3",
    "APScheduler >=3.10.1",
    "jinja2 >=3.1.6",
    "pydantic >=2.0.3",
    "playwright >=1.40.0",
    "aiofiles >=0.8.0",
    "beautifulsoup4 >=4.12.2",
    "loguru >=0.7.0",
    "json_tools >=0.4.1",
    "pytz >=2025.2",
    "pillow >=12.2.0"
]

[project.urls]
homepage = "https://github.com/wows-yuyuko/Hikari-core-v2"
repository = "https://github.com/wows-yuyuko/Hikari-core-v2"

[tool.poetry]
packages = [{include = "hikari_core"}]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[[tool.poetry.source]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple/"
priority = "primary"

[[tool.poetry.source]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple/"
priority = "supplemental"

[[tool.poetry.source]]
name = "tencent"
url = "https://mirrors.cloud.tencent.com/pypi/simple/"
priority = "supplemental"

[tool.black]
line-length = 150
skip-string-normalization = true

[tool.ruff]
line-length = 150
respect-gitignore = true
ignore-init-module-imports = true
select = [
    'F',  # pyflakes
    'E',  # pycodestyle errors
    'W',  # pycodestyle warnings
    'I',  # isort
    'C',  # flake8-comprehensions
    'B',  # flake8-bugbear
    'Q',  # flake8-quotes
    'PL',  # pylint
    'RUF',  # Ruff-specific rules
]
ignore = [
    'E501',
    "RUF001",
    "RUF002",
    "RUF003",
    "PLR2004",
    "C901",
    "PLR0912",
    "PLR0911",
    "PLW0603"
]
flake8-quotes = {inline-quotes = 'single', multiline-quotes = 'double'}